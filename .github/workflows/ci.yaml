# Workflow
name: CI - MLOps

# conditions
on:
  pull_request:
    branches:
      - main

# variables
env:
  PYTHON_VERSION: '3.10'

# jobs
jobs:
  validacao-ambiente:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pip install poetry

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'
      
      - name: Run script validation
        run: python validate-env.py
      
      - name: install nbstripout
        run: pip install nbstripout

      - name: Analyse notebooks
        run: |
          nbstripout --verify explorer.ipynb || (echo "ERROR: Notebook contains output. Please remove it before committing." && exit 1)
        
      - name: Install ruff (Linter)
        run: pip install ruff
      
      - name: Run linter
        run: ruff check . --exit-zero
      
      - name: Install dependencies
        run: poetry install

      - name: Run ETL (prepare data)
        run: poetry run python prepare_data.py

      - name: Dummy Training
        run: poetry run python dummy_train.py

      - name: Dummy Training with Governance
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: poetry run python dummy_train_governance.py

      - name: Tests (PyTest)
        run: poetry run pytest tests/ -v